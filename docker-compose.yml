services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soup_queue
      POSTGRES_USER: soup
      POSTGRES_PASSWORD: soup
    volumes:
      - soup-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soup -d soup_queue"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    command: ["sh", "-c", "python scripts/wait_for_db.py && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://soup:soup@postgres:5432/soup_queue
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  worker-1:
    build: .
    command: ["python", "-m", "app.workers.worker"]
    environment: &worker-env
      DATABASE_URL: postgresql+asyncpg://soup:soup@postgres:5432/soup_queue
      LOG_LEVEL: INFO
      LEASE_DURATION_SECONDS: 30
      HEARTBEAT_INTERVAL_SECONDS: 10
      WORKER_COUNT: 4
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s

  worker-2:
    build: .
    command: ["python", "-m", "app.workers.worker"]
    environment:
      <<: *worker-env
      WORKER_ID: worker-2
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s

  worker-3:
    build: .
    command: ["python", "-m", "app.workers.worker"]
    environment:
      <<: *worker-env
      WORKER_ID: worker-3
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s

  worker-4:
    build: .
    command: ["python", "-m", "app.workers.worker"]
    environment:
      <<: *worker-env
      WORKER_ID: worker-4
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s

volumes:
  soup-postgres-data:
